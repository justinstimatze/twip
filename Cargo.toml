[package]
name = "twip"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A modern Flash: draw vector shapes on a timeline and export .swf that Ruffle plays. Compiler for .wick -> .swf."
repository = "https://github.com/justinstimatze/twip"
publish = false

[dependencies]
# swf serialization from the ruffle monorepo, pinned to one rev (crates.io 0.2.2 is a
# stale decoy). The exporter/preview player must be built from this SAME rev.
swf = { git = "https://github.com/ruffle-rs/ruffle", rev = "645449a5c602044471f045546a0a31af0df9cd69" }
zip = { version = "2", default-features = false, features = ["deflate"] }
serde_json = "1"
anyhow = "1"
i_overlay = "7.0.2"

[lib]
name = "twip"
path = "src/lib.rs"

[[bin]]
name = "twip"
path = "src/main.rs"
