[package]
name = "twip"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A modern Flash: draw vector shapes on a timeline and export .swf that Ruffle plays. Compiler for .wick -> .swf."
repository = "https://github.com/justinstimatze/twip"
publish = false

[dependencies]
# swf serialization from the ruffle monorepo, pinned to one rev (crates.io 0.2.2 is a
# stale decoy). The exporter/preview player must be built from this SAME rev.
swf = { git = "https://github.com/ruffle-rs/ruffle", rev = "645449a5c602044471f045546a0a31af0df9cd69" }
zip = { version = "2", default-features = false, features = ["deflate"] }
serde_json = "1"
anyhow = "1"
i_overlay = "7.0.2"
# Only pulled in under the `golden` feature — the golden-PNG oracle (tests/golden.rs)
# uses it to decode ruffle's exported PNGs. Never compiled by a plain build/test.
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }

[features]
# Enables the Ruffle golden-PNG oracle test (tests/golden.rs). Off by default so the
# heavy ruffle exporter never gates a normal `cargo test` / pre-commit / fast CI run:
#   cargo test --features golden          # check against blessed goldens
#   TWIP_BLESS=1 cargo test --features golden   # (re)write goldens
golden = ["dep:image"]

# editor/ is the vendored wick-editor fork (its own Tauri cargo project that depends on
# this crate by path); oracle/ is the gitignored ruffle clone the golden oracle builds.
# Exclude both so `cargo build` here stays the compiler, not the app or the oracle.
[workspace]
exclude = ["editor", "oracle"]

# Cut debuginfo from full to line-tables-only for the everyday build/test loop.
# Keeps file:line in panic backtraces (all this crate's asserts need) while
# dropping the variable/type debuginfo that dominates debug-build codegen and
# link time. Reversible: delete this block to restore full `debug = 2`.
[profile.dev]
debug = "line-tables-only"

[lib]
name = "twip"
path = "src/lib.rs"

[[bin]]
name = "twip"
path = "src/main.rs"
