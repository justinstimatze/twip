name: editor

# The editor's checks all existed and ran nowhere: ci.yml is Rust-only, so `pnpm build`,
# the engine's mocha suite, the notices generator and the two Playwright scripts were
# whatever the last person happened to run locally.
#
# Path-filtered because the editor is a vendored fork inside a Rust repo — a commit that only
# touches fixtures/ or the oracle has no reason to spend five minutes on a browser.
#
# The compiler's own sources ARE in the filter, and that is not over-inclusion. `pnpm
# wasm-check` requires the tab and the CLI to emit identical bytes from one input, and the way
# two backends built from one source drift apart is a change to that source. A filter that
# skipped src/ would run the agreement check only on commits that could not break it.
#
# The two lists are duplicated because GitHub Actions does not resolve YAML anchors — an
# `&paths`/`*paths` pair parses as a literal string and silently filters nothing.
on:
  push:
    branches: [main]
    paths:
      - 'editor/**'
      - 'wasm/**'
      - 'src/**'
      - 'fixtures/editor-tween.wick'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/editor.yml'
  pull_request:
    branches: [main]
    paths:
      - 'editor/**'
      - 'wasm/**'
      - 'src/**'
      - 'fixtures/editor-tween.wick'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/editor.yml'
  # A site you cannot redeploy without inventing a commit is a site that goes stale. The
  # deploy job below accepts a dispatch on main for exactly that.
  workflow_dispatch:

concurrency:
  group: editor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: editor

jobs:
  editor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # pnpm before setup-node: setup-node's pnpm cache needs the binary to already exist.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: editor/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: editor/.nvmrc
          cache: pnpm
          cache-dependency-path: |
            editor/pnpm-lock.yaml
            editor/engine/pnpm-lock.yaml

      # rust-toolchain.toml pins the channel; wasm32 is the browser compiler's target and the
      # host triple builds the CLI that wasm-check compares its output against.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      # Pinned to the crate version in wasm/Cargo.lock. wasm-bindgen refuses to run a CLI and
      # a crate at different versions, so an unpinned install breaks this job the day the next
      # patch release lands, for no reason connected to any change here.
      #
      # RUSTFLAGS empty on purpose, twice over: the repo's .cargo/config.toml adds
      # -fuse-ld=mold for x86_64 linux, which no runner has, and its `-D warnings` would apply
      # to wasm-bindgen-cli's own source, which is not ours to keep warning-free.
      - name: Install wasm-bindgen-cli
        env:
          RUSTFLAGS: ''
        run: |
          VERSION=$(dev/build-wasm.sh --print-bindgen-version)
          echo "wasm/Cargo.lock wants wasm-bindgen $VERSION"
          if [ "$(wasm-bindgen --version 2>/dev/null | awk '{print $2}')" = "$VERSION" ]; then
            echo "cached, skipping"
          else
            cargo install wasm-bindgen-cli --locked --version "$VERSION"
          fi

      # engine/ is a separate package with its own lockfile, not a workspace member.
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir engine install --frozen-lockfile

      # Cheapest first, so a stale notices file does not wait on a browser download.
      - name: Notices match the lockfile
        run: pnpm notices:check

      # Every icon name the source asks for has a drawing. A missing one renders nothing —
      # no error, no placeholder — so nothing else in this workflow would catch it.
      - name: Every icon name resolves
        run: pnpm icons:check

      # index.html loads /corelibs/ruffle/ruffle.js from a script tag and the directory is
      # gitignored, so without this the console check has a 404 in it. Before the build, not
      # after: vite copies public/ into build/ as it runs, and `preview` serves build/.
      - name: Cache the Ruffle runtime
        uses: actions/cache@v4
        with:
          path: editor/public/corelibs/ruffle
          key: ruffle-${{ hashFiles('editor/dev/fetch-ruffle.sh') }}

      - name: Stage the Ruffle runtime
        run: dev/fetch-ruffle.sh

      # Before the build, not after: vite decides at load time whether `virtual:twip-wasm`
      # resolves to the real package or to the stub, so a build that ran first would ship the
      # stub and wasm-check would fail against a bundle nobody would ever ship.
      - name: Build the browser compiler
        env:
          RUSTFLAGS: '-D warnings'
        run: pnpm wasm

      - name: Build
        run: pnpm build

      # wasm-check compares the tab's bytes against this binary's.
      - name: Build the twip CLI
        working-directory: .
        env:
          RUSTFLAGS: '-D warnings'
        run: cargo build --release --bin twip

      # Both packages pin playwright 1.62.0 and share ~/.cache/ms-playwright, so one install
      # serves the engine suite and the editor scripts. --with-deps pulls the system libs
      # headless chromium needs on a bare runner.
      - name: Install chromium
        run: pnpm exec playwright install --with-deps chromium

      # PLAYWRIGHT_CHANNEL='' selects that chromium. Unset would mean the system Chrome,
      # which is what every local run uses and what no runner should be trusted to have.
      - name: Engine tests
        run: pnpm test-engine
        env:
          PLAYWRIGHT_CHANNEL: ''

      # `vite preview` serves the build/ that `pnpm build` just produced, so the browser
      # checks run against the bundle that ships rather than the dev server. Backgrounded:
      # the runner leaves it alone once the step's shell exits, and the job tears it down.
      - name: Serve the build
        run: |
          pnpm preview --port 4173 --strictPort > /tmp/preview.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://localhost:4173 > /dev/null && exit 0
            sleep 1
          done
          echo "preview server never came up:" && cat /tmp/preview.log && exit 1

      - name: Smoke (every breakpoint)
        run: pnpm smoke --sweep
        env:
          PLAYWRIGHT_CHANNEL: ''
          SMOKE_URL: http://localhost:4173

      - name: Interact
        run: pnpm interact
        env:
          PLAYWRIGHT_CHANNEL: ''
          SMOKE_URL: http://localhost:4173

      # The Outliner is the one drag that edits the document rather than importing a file, and
      # until this existed nothing but a hand ever tried it.
      - name: Outliner drags and its preview is a real image
        run: pnpm drag-check
        env:
          PLAYWRIGHT_CHANNEL: ''
          SMOKE_URL: http://localhost:4173

      # Fourteen shortcut behaviours, thirteen of them recorded against react-hotkeys before it
      # was replaced. The sequence strings in hotKeyMap.js are also the labels the settings modal
      # renders, so a change here can be wrong twice over and look right once.
      - name: Every keyboard shortcut still behaves
        run: pnpm hotkeys-check
        env:
          PLAYWRIGHT_CHANNEL: ''
          SMOKE_URL: http://localhost:4173

      # The Inspector's label column is sized in percentages of a panel that is 200px wide at
      # its narrowest, and nobody develops at 200px. This reads the label strings out of
      # Inspector.jsx and the panel's range out of Editor.jsx, so a label added later is
      # covered without anyone remembering this exists.
      - name: Every Inspector label fits its row
        run: pnpm inspector-check
        env:
          PLAYWRIGHT_CHANNEL: ''
          SMOKE_URL: http://localhost:4173

      # The timeline is a canvas, so it is empty to a screen reader; TimelineMirror.jsx puts the
      # same model in a focusable DOM grid beside it. A mirror can drift from what it mirrors
      # without anyone hearing, so these cases compare the grid against the engine rather than
      # against a fixture.
      - name: The timeline answers to a keyboard
        run: pnpm a11y-timeline-check
        env:
          PLAYWRIGHT_CHANNEL: ''
          SMOKE_URL: http://localhost:4173

      # The one check that presses the button twip exists for. No bridge is running here, so a
      # silent fall back to it cannot pass this off as working.
      - name: Browser compiles a .wick, byte-identical to the CLI
        run: pnpm wasm-check
        env:
          PLAYWRIGHT_CHANNEL: ''
          SMOKE_URL: http://localhost:4173

      # Last step on purpose: every check above has to pass before the bundle is even a
      # candidate to ship, and a failing one stops the job here. `path` is workspace-relative
      # — the `working-directory` default above applies to `run`, not to action inputs.
      - name: Package the site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: editor/build

  # twip.ink. Deploys the same bundle the checks just ran against rather than rebuilding it,
  # which is both ten minutes cheaper and the only version of this that cannot ship something
  # unchecked. `public/CNAME` rides along in the artifact; the apex needs it on every deploy.
  #
  # The visibility check is release.yml's, applied to a second artifact. A minified bundle
  # served to a browser is conveyed object code as much as the .deb is, and the editor is
  # GPLv3 — so while the repository is private there is no corresponding source to point
  # anyone at, and the site must not go up. Skips rather than fails: this runs on every push
  # to main, and a red build on every commit would be noise around a fact that only changes
  # once. It starts deploying by itself the first push after the repository goes public.
  deploy:
    needs: editor
    if: >-
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      && github.repository_visibility != 'private'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # Not cancel-in-progress: a half-finished deploy is a broken site, so let one land before
    # the next starts. This is a different group from the build's — cancelling a superseded
    # build is fine, cancelling a live deploy is not.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
