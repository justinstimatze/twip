name: desktop

# Keeps a current .deb available without anyone remembering to build one. Install the newest
# with scripts/install-desktop.sh.
#
# Path-filtered because the build takes about ten minutes, too long to spend on a commit that
# cannot change what the app does. src/ is in the filter and that is not over-inclusion: the
# shell links the twip crate directly and compiles in-process, so a change there changes the app.
#
# This only ever produces an artifact. Publishing is release.yml's job and happens on a v-tag,
# because the package carries a GPLv3 section 6 written offer — see LICENSING.md.
on:
  push:
    branches: [main]
    paths:
      - 'editor/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/desktop.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

# Superseded builds are cancelled here, unlike in release.yml where a tag build must always
# finish. Nothing depends on the artifact of a commit that main has already moved past.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deb:
    # The same build release.yml runs, called with no tag so it publishes nothing. Reused
    # rather than copied so the packaging can never be right in one file and stale in the
    # other — the licence check in particular has to run on every .deb that leaves here.
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
