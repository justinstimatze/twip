name: release

# Pushing a v-tag publishes a release. Dispatching runs the same build without one.
#
# Manual-only was a licensing decision rather than caution about the build: the .deb bundles
# the GPLv3 editor and its /usr/share/doc/twip/copyright carries a GPLv3 section 6 written
# offer naming this repository as the corresponding source, so while the repository was
# private that offer could not be honoured. It is public now, which is what this waited for.
# The guard below stays anyway — it is one `if` against shipping GPLv3 code with no route to
# the source it promises, and the condition it checks is one a repository setting can flip
# back at any time without anyone touching this file.
#
# See LICENSING.md.
# The build itself is also called by desktop.yml on pushes to main, which is why it is a
# `workflow_call` as well. That indirection exists because `on.push` cannot hold one paths
# filter for tags and another for branches — a `paths` list applies to both, so filtering the
# push build here would mean a v-tag landing on a commit that only touched docs quietly fails
# to release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create and release (e.g. v0.1.0). Leave blank to build without releasing.'
        required: false
        type: string
  workflow_call:
    inputs:
      tag:
        description: 'Tag to release. Blank builds the .deb and publishes nothing.'
        required: false
        default: ''
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deb:
    runs-on: ubuntu-latest
    # `gh release create` writes to the repository, and this repo's default workflow token is
    # read-only. Without this the whole build runs and then 403s on its last step.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # webkit2gtk and libsoup are wry's runtime; rfd reaches the file dialog through the
      # xdg portal, which needs no build-time package. libwebkit2gtk-4.1 is the version
      # tauri 2 links against — 4.0 is the one for tauri 1 and will not satisfy it.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libsoup-3.0-dev build-essential

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: editor/src-tauri

      # `cargo tauri` is not a runner builtin and nothing else here installs it. Pinned to the
      # version that has actually bundled this tree, on editor.yml's wasm-bindgen reasoning: an
      # unpinned install breaks the job the day the next CLI release lands, for no reason
      # connected to any change here.
      #
      # RUSTFLAGS empty because .cargo/config.toml adds `-fuse-ld=mold` for any x86_64 linux and
      # config discovery walks up from the cwd — an install run from the repo root inherits it
      # onto a runner with no mold. Its `-D warnings` would also apply to the CLI's own source.
      #
      # Keyed on the CLI's version alone, which is the point. Swatinem/rust-cache above also
      # restores ~/.cargo/bin, but it keys on the editor workspace's lockfile — so every change
      # to the app's dependencies would otherwise throw away a compiled tauri-cli that has
      # nothing to do with them. This survives that churn; a version bump is what refetches it.
      - name: Cache the tauri CLI
        id: tauri-cli-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: cargo-tauri-2.11.4-${{ runner.os }}

      - name: Install the tauri CLI
        if: steps.tauri-cli-cache.outputs.cache-hit != 'true'
        env:
          RUSTFLAGS: ''
        run: cargo install tauri-cli --locked --version 2.11.4

      # There is no package.json at the repo root, so without this the action finds no
      # `packageManager` field and refuses to pick a version. Same argument as editor.yml.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: editor/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: editor/.nvmrc
          cache: pnpm
          cache-dependency-path: editor/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: editor
        run: pnpm install --frozen-lockfile

      # The shell embeds ../build at compile time, so the frontend has to exist first.
      # Ruffle is gitignored and fetched, and without it the SWF preview 404s at runtime.
      #
      # Deliberately no `pnpm wasm` here. compileWickToSWF takes the Tauri branch in this
      # shell, so the browser compiler would be ~480KB of bundled code the desktop build can
      # never reach. The stub vite substitutes in its place is the right thing to ship.
      - name: Stage Ruffle and build the frontend
        working-directory: editor
        run: |
          dev/fetch-ruffle.sh
          pnpm build

      - name: Build the .deb
        working-directory: editor/src-tauri
        # The repo's .cargo/config.toml sets -fuse-ld=mold for any x86_64 linux target, which
        # matches a runner that has no mold. An env RUSTFLAGS overrides both config blocks
        # wholesale — the same fix golden.yml carries, for the same reason.
        env:
          RUSTFLAGS: '-D warnings'
        run: cargo tauri build --bundles deb

      - name: Check the package carries its licences
        working-directory: editor/src-tauri
        run: |
          DEB=$(ls target/release/bundle/deb/*.deb)
          echo "built $DEB"
          dpkg-deb -f "$DEB"
          for f in usr/share/doc/twip/copyright usr/share/doc/twip/LICENSE.md; do
            dpkg-deb -c "$DEB" | grep -q "$f" || { echo "MISSING $f — see LICENSING.md"; exit 1; }
          done
          echo "copyright and GPL text present"

      - uses: actions/upload-artifact@v4
        with:
          name: twip-deb
          path: editor/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

      # Three ways in, one tag out: a pushed *tag* names itself, a dispatch names one or leaves
      # it blank, and a call from desktop.yml passes nothing at all.
      #
      # The ref has to be checked for being a tag, not just for the event being a push. Under
      # workflow_call the event stays whatever the caller's was, so a push to main reaching here
      # through desktop.yml would read github.ref_name as `main` and try to publish a release
      # called main.
      - name: Which tag, if any
        id: which
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish a release
        if: steps.which.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.which.outputs.tag }}
        run: |
          if [ "${{ github.repository_visibility }}" = "private" ]; then
            echo "Refusing to publish: the repository is private, and the package ships a"
            echo "GPLv3 section 6 offer naming it as the corresponding source. See LICENSING.md."
            exit 1
          fi
          NOTES="Linux desktop build (.deb). Other platforms are not built because the runners
          cost more than the demand for them so far — open an issue if you want one.

          The compiler itself is \`cargo install --git https://github.com/justinstimatze/twip\`
          on any platform Rust targets.

          Corresponding source is this repository; see LICENSING.md."
          # A re-pushed tag, or a release drafted by hand before the build finished, must not
          # fail the run — upload into the existing release instead. --clobber so the second
          # run's .deb replaces the first's rather than colliding with it.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists; uploading into it"
            gh release upload "$TAG" \
              editor/src-tauri/target/release/bundle/deb/*.deb --clobber
          else
            gh release create "$TAG" \
              editor/src-tauri/target/release/bundle/deb/*.deb \
              --title "$TAG" \
              --notes "$NOTES"
          fi
