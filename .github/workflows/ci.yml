name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs: a fresh push to the same branch/PR kills the in-flight job rather than
# letting both grind through the swf-crate build. main is excluded (unique group per run there) so
# landed commits always get a complete CI record. Lifted from camber.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins channel + components; this action honours it.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # tools/twipdoc is a separate Go module that check.sh runs. Pinned rather than left to
      # whatever the runner image ships, because its go.mod names a recent minimum.
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/twipdoc/go.mod
          cache-dependency-path: tools/twipdoc/go.sum

      # The exact same suite the local pre-commit hook runs — one script, so local
      # and CI strictness can't drift. clippy (deny warnings) is the gate; fmt is advisory.
      - name: Checks (fmt advisory, clippy, build, test)
        run: ./scripts/check.sh
