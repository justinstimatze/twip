<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <link rel="icon" href="/favicon.ico" sizes="48x48 32x32 16x16">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <!-- Matches --color-surface-void, so a mobile browser's own chrome joins the app
         instead of framing it in black. dev/make-icons.mjs draws the icons on the same. -->
    <meta name="theme-color" content="#110f0e">
    <meta name="description" content="A modern Flash. Draw vector shapes on a timeline, tween them, and export a real .swf that Ruffle plays.">
    <link rel="manifest" href="/manifest.json">

    <!-- Global scripts, served from public/: -->
    <!-- Wick Engine -->
    <script src="/corelibs/wick-engine/wickengine.js"></script>
    <!-- GIF Import/Export -->
    <script src="/corelibs/gif/gif.js"></script>
    <!-- preload.js -->
    <script src="/corelibs/preload/preloadjs.min.js"></script>
    <!-- Ruffle (SWF preview player) -->
    <script src="/corelibs/ruffle/ruffle.js"></script>
    <!-- Preloader animation CSS -->
    <link href="/preloader-animation.css" rel="stylesheet" type="text/css">
    <!-- Wait overlay CSS -->
    <link href="/wait-overlay.css" rel="stylesheet" type="text/css">

    <title>twip</title>
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0px;
        /* Matches --color-surface-void, so there is no white flash before the bundle's
           stylesheet lands. */
        background: #110f0e;
      }
    </style>
  </head>
  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="root"></div>
    <!--
      A frame ruler with a playhead running across it. See public/preloader-animation.css:
      the loading screen is the first statement of what this program is, so it is made of the
      two objects the program is about rather than a logo on a coloured field.
    -->
    <div id="preloader">
      <div class="preloader-ruler">
        <div class="preloader-playhead"></div>
      </div>
      <div class="preloader-wordmark">twip</div>
    </div>
    <div id="wait-overlay">
      Please wait...
    </div>
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
