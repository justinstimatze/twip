[package]
name = "twip-editor"
version = "0.1.0"
description = "twip desktop shell — the editor plus the compiler in one binary"
edition = "2021"
publish = false

[lib]
name = "twip_editor_lib"
# Desktop only: main.rs links the rlib. The staticlib (~700MB .a) + cdylib (~180MB .so)
# are Tauri's mobile-scaffold defaults and are dead weight in every build here.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# The twip compiler, called in-process. Vendored layout: this crate is at
# twip/editor/src-tauri/, and the twip crate root is the repo root (twip/), so "../.."
# from here. (Excluded from twip's cargo workspace via [workspace] exclude in twip/Cargo.toml.)
twip = { path = "../.." }

# This is a preview shell, not something we gdb — drop DWARF for all 310 crates in the
# dep tree (webkit/wry + the bundler's codec stack). Cuts the debug target from ~4G to <2G.
[profile.dev]
debug = 0
